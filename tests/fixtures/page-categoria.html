ody\":{\"value\":\"<p>A pochi mesi dalle elezioni, Giorgia Meloni cala le carte della sua strategia economica: una manovra da 26 miliardi di euro che promette meno tasse, aiuti alle famiglie, incentivi per i giovani lavoratori e misure per la casa. La premier rivendica interventi mirati e non \\\"a pioggia\\\", assicurando coperture finanziarie per ogni provvedimento. Ma sono misure sufficienti a sostenere la crescita e il potere d'acquisto degli italiani? E quali effetti avranno sui conti pubblici? Ne discutiamo con Tito Boeri, Monica Guerzoni, Gad Lerner e Lucio Caracciolo.<br><br><br>\u201cLa fotografia mostrata nel corso della puntata del 29 ottobre ritrae la dott.ssa Francesca Crupi, pubblico ministero nel procedimento che aveva richiesto la convalida del fermo e l\u2019applicazione della misura cautelare della custodia in carcere, e non la dott.ssa Tiziana Landoni, GIP che ha adottato il provvedimento di scarcerazione di Youssef Siher\u201d</p>\",\"summary\":\"\"},\"smartTvLocandina\":null,\"dataMessaInOnda\":{\"timestamp\":1793302950,\"time\":\"2026-10-29T19:42:30+00:00\"},\"numeroEpisodio\":34,\"numeroStagione\":{\"name\":\"26\"},\"urlVideo\":null,\"uploadVideo\":{\"cf_duration\":\"1954\",\"cf_entry_id\":\"0_z7o4hvh0\",\"cf_thumbnail_url\":\"https://images.la7play.it/video/0/406/0_z7o4hvh0_0_oj37r82y_2/meloni-la-manovra-e-i-giudici-ancora-nel-mirino-puntata-del/scena-854x480.webp\",\"thumbnailDefault\":{\"url\":\"https://images.la7play.it/video/0/406/0_z7o4hvh0_0_oj37r82y_2/meloni-la-manovra-e-i-giudici-ancora-nel-mirino-puntata-del/scena-854x480.webp\",\"variations\":[{\"style\":\"scena_lg\",\"url\":\"https://images.la7play.it/video/0/406/0_z7o4hvh0_0_oj37r82y_2/meloni-la-manovra-e-i-giudici-ancora-nel-mirino-puntata-del/scena-1280x720.webp\",\"width\":1280,\"height\":720},{\"style\":\"scena_sm\",\"url\":\"https://images.la7play.it/video/0/406/0_z7o4hvh0_0_oj37r82y_2/meloni-la-manovra-e-i-giudici-ancora-nel-mirino-puntata-del/scena-640x360.webp\",\"width\": 3.webp\",\"width\":400,\"height\":533},{\"style\":\"cover_xs\",\"url\":\"https://images.la7play.it/video/0/406/0_7dr3gqdd_0_986gwhtw_2/d-alema-l-ex-comunista-e-la-destra-al-potere-puntata-del-28/cover-200x267.webp\",\"width\":200,\"height\":267}]}}},\"screenWidth\":null,\"isLa7Cinema\":false,\"showPuntataIntera\":true}]\n3f:[\"$\",\"$L3d\",\"397980\",{\"index\":3,\"data\":{\"id\":\"397980\",\"title\":\"Del Vecchio vuole comprare Travaglio - Puntata del 27/10/2026\",\"tags\":null,\"path\":\"/otto-e-mezzo/puntate/puntata-del-27-10-2026-397980\",\"property\":{\"id\":\"549\",\"name\":\"Otto e mezzo\",\"titolo\":\"Otto e mezzo\",\"description\":{\"value\":\"<p>Otto e mezzo</p>\",\"plainValue\":\"Otto e mezzo\"}},\"created\":{\"timestamp\":1793134429,\"time\":\"2026-10-27T20:53:49+00:00\"},\"body\":{\"value\":\"<p>A Otto e Mezzo si discute del possibile ingresso di Leonardo Maria Del Vecchio nell'azionariato del Fatto Quotidiano, un'ipotesi che ha riacceso il dibattito sul rapporto tra editoria, finanza e indipendenza dell'informazione. Nel suo intervento, Marco Travaglio mette in evidenza quella che considera una contraddizione: l'interesse dell'imprenditore per il quotidiano arriva dopo anni di dure critiche rivolte al giornale e ai suoi giornalisti. Da qui il confronto sulle ragioni industriali e strategiche dell'operazione e sui possibili conflitti di interesse che potrebbero emergere nel panorama editoriale italiano. Il dibattito si concentra anche sul ruolo dei grandi gruppi economici nell'informazione, sull'autonomia delle testate giornalistiche e sui cambiamenti che stanno interessando il settore dei media.</p>\",\"summary\":\"\"},\"smartTvLocandina\":null,\"dataMessaInOnda\":{\"timestamp\":1793129949,\"time\":\"2026-10-27T19:39:09+00:00\"},\"numeroEpisodio\":32,\"numeroStagione\":{\"name\":\"26\"},\"urlVideo\":null,\"uploadVideo\":{\"cf_duration\":\"1812\",\"cf_entry_id\":\"0_a30hvn47\",\"cf_thumbnail_url\":\"https://images.la7play.it/video/0/406/0_a30hvn47_0_est \",\"$L3d\",\"397857\",{\"index\":4,\"data\":{\"id\":\"397857\",\"title\":\"Le piazze, la destra e i conti con la storia  - Puntata del 26/10/2026\",\"tags\":null,\"path\":\"/otto-e-mezzo/puntate/puntata-del-26-10-2026-397857\",\"property\":{\"id\":\"549\",\"name\":\"Otto e mezzo\",\"titolo\":\"Otto e mezzo\",\"description\":{\"value\":\"<p>Otto e mezzo</p>\",\"plainValue\":\"Otto e mezzo\"}},\"created\":{\"timestamp\":1793048057,\"time\":\"2026-10-26T20:54:17+00:00\"},\"body\":{\"value\":\"<p>Apertura subito sul confronto tra Governo e sindaci. Lilli Gruber chiede a Beppe Sala di commentare la risposta di Giorgia Meloni alla richiesta di un incontro dedicato: la premier ribadisce la disponibilit\u00e0 al dialogo, ma attraverso la Conferenza Stato-Citt\u00e0 e con tutti i sindaci, non solo con una parte di essi. Sala smorza immediatamente i toni: \\\"Le polemiche stanno a zero\\\", rivendicando la volont\u00e0 di un confronto concreto con il Governo sui temi che riguardano le amministrazioni locali. Altri ospiti della puntata: Michela Ponzani, Luigi Zanda, Massimo Giannini,</p>\",\"summary\":\"\"},\"smartTvLocandina\":null,\"dataMessaInOnda\":{\"timestamp\":1793043992,\"time\":\"2026-10-26T19:46:32+00:00\"},\"numeroEpisodio\":31,\"numeroStagione\":{\"name\":\"26\"},\"urlVideo\":null,\"uploadVideo\":{\"cf_duration\":\"2025\",\"cf_entry_id\":\"0_s9gvtsp3\",\"cf_thumbnail_url\":\"https://images.la7play.it/video/0/402/0_s9gvtsp3_0_fcu0ctxm_2/le-piazze-la-destra-e-i-conti-con-la-storia-puntata-del-26-1/scena-854x480.webp\",\"thumbnailDefault\":{\"url\":\"https://images.la7play.it/video/0/402/0_s9gvtsp3_0_fcu0ctxm_2/le-piazze-la-destra-e-i-conti-con-la-storia-puntata-del-26-1/scena-854x480.webp\",\"variations\":[{\"style\":\"scena_lg\",\"url\":\"https://images.la7play.it/video/0/402/0_s9gvtsp3_0_fcu0ctxm_2/le-piazze-la-destra-e-i-conti-con-la-storia-puntata-del-26-1/scena-1280x720.webp\",\"width\":1280,\"height\":720},{\"style\":\"scena_sm\",\"url\":\"https://images.la7pl alle proteste giovanili di Milano, fino alle misure annunciate dal governo per contrastare disordini e manifestazioni. Giorgia Meloni ribadisce la linea della fermezza contro il blocco dei trasporti e non esclude la precettazione, mentre dopo gli scontri di Milano si discute di nuovi strumenti repressivi, maggiori controlli e del possibile impiego dei militari. Una risposta che il governo considera necessaria per garantire sicurezza e ordine pubblico, ma che continua a dividere politica e opinione pubblica. Al centro del dibattito una domanda: il pugno duro \u00e8 la soluzione pi\u00f9 efficace per affrontare le tensioni sociali o rappresenta soprattutto una scelta politica destinata a parlare all'elettorato? Lilli Gruber affronta il tema con i suoi ospiti, analizzando le proteste, la risposta del governo e il delicato equilibrio tra sicurezza, diritti e partecipazione democratica.&nbsp;</p><p>Ospiti di Lilli Gruber: Michela Ponzani, Alessandro De Angelis, Massimo Giannini, Brunella Bolloli</p>42:[\"$\",\"$L3d\",\"397492\",{\"index\":6,\"data\":{\"id\":\"397492\",\"title\":\"Giorgia Meloni: legge e ordine o stato di polizia? - Puntata del 22/10/2026\",\"tags\":null,\"path\":\"/otto-e-mezzo/puntate/puntata-del-22-10-2026-397492\",\"property\":{\"id\":\"549\",\"name\":\"Otto e mezzo\",\"titolo\":\"Otto e mezzo\",\"description\":{\"value\":\"<p>Otto e mezzo</p>\",\"plainValue\":\"Otto e mezzo\"}},\"created\":{\"timestamp\":1792698898,\"time\":\"2026-10-22T19:54:58+00:00\"},\"body\":{\"value\":\"$51\",\"summary\":\"\"},\"smartTvLocandina\":null,\"dataMessaInOnda\":{\"timestamp\":1792694426,\"time\":\"2026-10-22T18:40:26+00:00\"},\"numeroEpisodio\":29,\"numeroStagione\":{\"name\":\"26\"},\"urlVideo\":null,\"uploadVideo\":{\"cf_duration\":\"1975\",\"cf_entry_id\":\"0_s4xapoy1\",\"cf_thumbnail_url\":\"https://images.la7play.it/video/0/401/0_s4xapoy1_0_ry9tu643_2/giorgia-meloni-legge-e-ordine-o-stato-di-polizia-puntata-del/scena-854x480.webp\",\"thumbnailDefault\":{\"url\": -600x800.webp\",\"variations\":[{\"style\":\"cover_sm\",\"url\":\"https://images.la7play.it/video/0/401/0_cae3jeg1_0_2zu1k7fl_2/meloni-nuovi-reati-e-chi-rompe-paga-puntata-del-20-10-2026/cover-400x533.webp\",\"width\":400,\"height\":533},{\"style\":\"cover_xs\",\"url\":\"https://images.la7play.it/video/0/401/0_cae3jeg1_0_2zu1k7fl_2/meloni-nuovi-reati-e-chi-rompe-paga-puntata-del-20-10-2026/cover-200x267.webp\",\"width\":200,\"height\":267}]}}},\"screenWidth\":null,\"isLa7Cinema\":false,\"showPuntataIntera\":true}]\n45:[\"$\",\"$L3d\",\"397130\",{\"index\":9,\"data\":{\"id\":\"397130\",\"title\":\"Meloni, le piazze in fiamme e l'ennesimo decreto - Puntata del 19/10/2026\",\"tags\":null,\"path\":\"/otto-e-mezzo/puntate/puntata-del-19-10-2026-397130\",\"property\":{\"id\":\"549\",\"name\":\"Otto e mezzo\",\"titolo\":\"Otto e mezzo\",\"description\":{\"value\":\"<p>Otto e mezzo</p>\",\"plainValue\":\"Otto e mezzo\"}},\"created\":{\"timestamp\":1792440292,\"time\":\"2026-10-19T20:04:52+00:00\"},\"body\":{\"value\":\"<p>Si torna sugli scontri che hanno segnato il fine settimana a Milano, con il centro cittadino teatro di episodi di violenza e tensione. Al centro del dibattito le polemiche tra il sindaco Giuseppe Sala e il ministro dell\u2019Interno Matteo Piantedosi sulle misure adottate per garantire la sicurezza e prevenire i disordini. La puntata approfondisce le responsabilit\u00e0 nella gestione dell\u2019ordine pubblico e le decisioni annunciate dal governo per rafforzare la presenza delle forze di sicurezza nel capoluogo lombardo. Ospiti di Lilli Gruber: Massimo Cacciari, Cathy La Torre, Franco Gabrielli, Andrea Scanzi</p>\",\"summary\":\"\"},\"smartTvLocandina\":null,\"dataMessaInOnda\":{\"timestamp\":1792435684,\"time\":\"2026-10-19T18:48:04+00:00\"},\"numeroEpisodio\":26,\"numeroStagione\":{\"name\":\"26\"},\"urlVideo\":null,\"uploadVideo\":{\"cf_duration\":\"1925\",\"cf_entry_id\":\"0_m9kmqffo\",\"cf_thumbnail_url\":\"https://images.la7play.it/video/0/401/0_m9k }]\n46:[\"$\",\"$L3d\",\"396457\",{\"index\":10,\"data\":{\"id\":\"396457\",\"title\":\"Cortei, proteste, scontri: \u00e8 il \\\"no Meloni day\\\" - Puntata del 16/10/2026\",\"tags\":null,\"path\":\"/otto-e-mezzo/puntate/puntata-del-16-10-2026-396457\",\"property\":{\"id\":\"549\",\"name\":\"Otto e mezzo\",\"titolo\":\"Otto e mezzo\",\"description\":{\"value\":\"<p>Otto e mezzo</p>\",\"plainValue\":\"Otto e mezzo\"}},\"created\":{\"timestamp\":1792180765,\"time\":\"2026-10-16T19:59:25+00:00\"},\"body\":{\"value\":\"<p>A Otto e Mezzo il confronto parte da una giornata segnata da proteste e disagi in tutta Italia. Dalla mobilitazione degli autotrasportatori, che sta causando pesanti ripercussioni soprattutto nel Mezzogiorno, alle manifestazioni studentesche del \\\"No Meloni Day\\\", fino alle proteste legate al futuro dell'ex Ilva e ai disservizi nel traffico aereo causati da un guasto alla rete di controllo. Una serie di emergenze che riapre il confronto tra il racconto del Paese fornito dal governo e la realt\u00e0 vissuta da cittadini, lavoratori e imprese. La puntata si interroga su quanto pesino inflazione, crisi industriali, trasporti e tensioni sociali nel giudizio sull'operato dell'esecutivo. Lilli Gruber e i suoi ospiti, Rocco Casalino, Rosi Braidotti, Sabrina Brizzola, Italo Bocchino, analizzano le proteste che attraversano il Paese, le difficolt\u00e0 economiche e sociali e il crescente divario tra narrazione politica e realt\u00e0 quotidiana.</p>\",\"summary\":\"\"},\"smartTvLocandina\":null,\"dataMessaInOnda\":{\"timestamp\":1792176203,\"time\":\"2026-10-16T18:43:23+00:00\"},\"numeroEpisodio\":25,\"numeroStagione\":{\"name\":\"26\"},\"urlVideo\":null,\"uploadVideo\":{\"cf_duration\":\"1947\",\"cf_entry_id\":\"0_uibmf1pm\",\"cf_thumbnail_url\":\"https://images.la7play.it/video/0/401/0_uibmf1pm_0_6t7x7a3i_2/cortei-proteste-scontri-e-il-no-meloni-day-puntata-del-16-10/scena-854x480.webp\",\"thumbnailDefault\":{\"url\":\"https://images.la7play.it/video/0/401/0_uibmf1pm_0_6t7x7a3i_2/cortei-proteste-scontri-e-il-no-meloni-day-puntata-del-16-10/scena-854x480.webp\",\"variations\":[{\"style\":\"scena_lg\",\"url\":\"https://images.la7play.it/video/0/401/0_uibmf1pm_0_6t7x7a3i_2/cortei-proteste-scontri-e-il-no-meloni-day-puntata-del-16-10/scena-1280x720.webp\",\"width\":1280,\"height\":720},{\"style\":\"scena_sm\",\"url\":\"https://images.la7play.it/video/0/401/0_uibmf1pm_0_6t7x7a3i_2/cortei-proteste-scontri-e-il-no-meloni-day-puntata-del-16-10/scena-640x360.webp\",\"width\":640,\"height\":360}]},\"cf_thumbnail_scena\":{\"url\":\"https://images.la7play.it/video/0/401/0_uibmf1pm_0_zpde3p3q_2/cortei-proteste-scontri-e-il-no-meloni-day-puntata-del-16-10/scena-854x480.webp\",\"variations\":[{\"style\":\"scena_lg\",\"url\":\"https://images.la7play.it/video/0/401/0_uibmf1pm_0_zpde3p3q_2/cortei-proteste-scontri-e-il-no-meloni-day-puntata-del-16-10/scena-1280x720.webp\",\"width\":1280,\"height\":720},{\"style\":\"scena_sm\",\"url\":\"https://images.la7play.it/video/0/401/0_uibmf1pm_0_zpde3p3q_2/cortei-proteste-scontri-e-il-no-meloni-day-puntata-del-16-10/scena-640x360.webp\",\"width\":640,\"height\":360}]},\"cf_thumbnail_cover\":{\"url\":\"https://images.la7play.it/video/0/401/0_uibmf1pm_0_13r8jqa6_2/cortei-proteste-scontri-e-il-no-meloni-day-puntata-del-16-10/cover-600x800.webp\",\"variations\":[{\"style\":\"cover_sm\",\"url\":\"https://images.la7play.it/video/0/401/0_uibmf1pm_0_13r8jqa6_2/cortei-proteste-scontri-e-il-no-meloni-day-puntata-del-16-10/cover-400x533.webp\",\"width\":400,\"height\":533},{\"style\":\"cover_xs\",\"url\":\"https://images.la7play.it/video/0/401/0_uibmf1pm_0_13r8jqa6_2/cortei-proteste-scontri-e-il-no-meloni-day-puntata-del-16-10/cover-200x267.webp\",\"width\":200,\"height\":267}]}}},\"screenWidth\":null,\"isLa7Cinema\":false,\"showPuntataIntera\":true}]\n47:[\"$\",\"$L3d\",\"396315\",{\"index\":11,\"data\":{\"id\":\"396315\",\"title\":\"Meloni, tante parole e pochi soldi - Puntata del 15/10/2026\",\"tags\":null,\"path\":\"/otto-e-mezzo/puntate/puntata-del-15-10-2026-396315\",\"property\":{\"id\":\"549\",\"name\":\"Otto e mezzo\",\"titolo\":\"Otto e mezzo\",\"description\":{\"value\":\"<p>Otto e mezzo</p>\",\"plainValue\":\"Otto e mezzo\"}},\"created\":{\"timestamp\":1792093442,\"time\":\"2026-10-15T19:44:02+00:00\"},\"body\":{\"value\":\"<p>Il confronto di oggi si concentra sulla nuova manovra economica varata dal governo e presentata a Bruxelles durante il Consiglio europeo. Sullo sfondo, un clima sociale segnato dalle proteste di agricoltori, autotrasportatori e lavoratori dell\u2019Ilva, che denunciano le difficolt\u00e0 economiche di diversi settori produttivi. La puntata analizza contenuti e priorit\u00e0 della manovra, tra risorse destinate alla difesa, sostegno all\u2019economia e impatto sulle famiglie e sul sistema produttivo italiano.&nbsp;</p><p>Ospiti di Lilli Gruber: Massimo Giannini, Marco Travaglio, Silvia Sciorilli Borrelli</p>\",\"summary\":\"\"},\"smartTvLocandina\":null,\"dataMessaInOnda\":{\"timestamp\":1792089545,\"time\":\"2026-10-15T18:39:05+00:00\"},\"numeroEpisodio\":24,\"numeroStagione\":{\"name\":\"26\"},\"urlVideo\":null,\"uploadVideo\":{\"cf_duration\":\"1984\",\"cf_entry_id\":\"0_98v4z68y\",\"cf_thumbnail_url\":\"https://images.la7play.it/video/0/400/0_98v4z68y_0_qg144bv0_2/meloni-tante-parole-e-pochi-soldi-puntata-del-15-10-2026/scena-854x480.webp\",\"thumbnailDefault\":{\"url\":\"https://images.la7play.it/video/0/400/0_98v4z68y_0_qg144bv0_2/meloni-tante-parole-e-pochi-soldi-puntata-del-15-10-2026/scena-854x480.webp\",\"variations\":[{\"style\":\"scena_lg\",\"url\":\"https://images.la7play.it/video/0/400/0_98v4z68y_0_qg144bv0_2/meloni-tante-parole-e-pochi-soldi-puntata-del-15-10-2026/scena-1280x720.webp\",\"width\":1280,\"height\":720},{\"style\":\"scena_sm\",\"url\":\"https://images.la7play.it/video/0/400/0_98v4z68y_0_qg144bv0_2/meloni-tante-parole-e-pochi-soldi-puntata-del-15-10-2026/scena-640x360.webp\",\"width\":640,\"height\":360}]}, ,\"url\":\"https://images.la7play.it/video/0/400/0_u4sixxw0_0_uo8cueum_2/meloni-e-sempre-colpa-di-qualcun-altro-puntata-del-14-10-202/cover-400x533.webp\",\"width\":400,\"height\":533},{\"style\":\"cover_xs\",\"url\":\"https://images.la7play.it/video/0/400/0_u4sixxw0_0_uo8cueum_2/meloni-e-sempre-colpa-di-qualcun-altro-puntata-del-14-10-202/cover-200x267.webp\",\"width\":200,\"height\":267}]}}},\"screenWidth\":null,\"isLa7Cinema\":false,\"showPuntataIntera\":true}]\n49:[\"$\",\"$L3d\",\"396008\",{\"index\":13,\"data\":{\"id\":\"396008\",\"title\":\"\\\"Nuvoloni\\\" sull'economia e Parlamento vuoto - Puntata del 13/10/2026\",\"tags\":null,\"path\":\"/otto-e-mezzo/puntate/puntata-del-13-10-2026-396008\",\"property\":{\"id\":\"549\",\"name\":\"Otto e mezzo\",\"titolo\":\"Otto e mezzo\",\"description\":{\"value\":\"<p>Otto e mezzo</p>\",\"plainValue\":\"Otto e mezzo\"}},\"created\":{\"timestamp\":1791921287,\"time\":\"2026-10-13T19:54:47+00:00\"},\"body\":{\"value\":\"<p>A Montecitorio l'aula \u00e8 quasi deserta: appena dodici parlamentari presenti, divisi tra maggioranza e opposizione. Eppure, in quel momento, il ministro dell'Economia Giancarlo Giorgetti stava illustrando uno scostamento di bilancio da 28 miliardi di euro in due anni, destinato a difesa ed energia. Temi cruciali, dalla manovra economica ai conti pubblici, che incidono direttamente sulla vita degli italiani.&nbsp;</p><p>Che immagine restituisce un Parlamento cos\u00ec vuoto davanti a una delle discussioni pi\u00f9 importanti per il Paese? E soprattutto: se la politica diserta il confronto nei momenti decisivi, chi si assume la responsabilit\u00e0 delle scelte che determineranno il futuro economico dell'Italia?&nbsp;</p><p>Ospiti di Lilli Gruber: Monica Guerzoni, Tito Boeri, Tomaso Montanari</p>\",\"summary\":\"\"},\"smartTvLocandina\":null,\"dataMessaInOnda\":{\"timestamp\":1791916878,\"time\":\"2026-10-13T18:41:18+00:00\"},\"numeroEpisodio\":22,\"numeroStagione\":{\"name\":\"26\"},\"urlVideo\":null,\"uploadVideo\":{\"cf_duration\":\"1809\",\"cf_entry_id\":\"0_1r3bbnld\",\"cf_thumbnail_url\":\"https://images.la7play.it/video/0/400/0_1r3bbnld_0_kp1951qa_2/nuvoloni-sull-economia-e-parlamento-vuoto-puntata-del-13-10/scena-854x480.webp\",\"thumbnailDefault\":{\"url\":\"https://images.la7play.it/video/0/400/0_1r3bbnld_0_kp1951qa_2/nuvoloni-sull-economia-e-parlamento-vuoto-puntata-del-13-10/scena-854x480.webp\",\"variations\":[{\"style\":\"scena_lg\",\"url\":\"https://images.la7play.it/video/0/400/0_1r3bbnld_0_kp1951qa_2/nuvoloni-sull-economia-e-parlamento-vuoto-puntata-del-13-10/scena-1280x720.webp\",\"width\":1280,\"height\":720},{\"style\":\"scena_sm\",\"url\":\"https://images.la7play.it/video/0/400/0_1r3bbnld_0_kp1951qa_2/nuvoloni-sull-economia-e-parlamento-vuoto-puntata-del-13-10/scena-640x360.webp\",\"width\":640,\"height\":360}]},\"cf_thumbnail_scena\":{\"url\":\"https://images.la7play.it/video/0/400/0_1r3bbnld_0_xwtxnoov_2/nuvoloni-sull-economia-e-parlamento-vuoto-puntata-del-13-10/scena-854x480.webp\",\"variations\":[{\"style\":\"scena_lg\",\"url\":\"https://images.la7play.it/video/0/400/0_1r3bbnld_0_xwtxnoov_2/nuvoloni-sull-economia-e-parlamento-vuoto-puntata-del-13-10/scena-1280x720.webp\",\"width\":1280,\"height\":720},{\"style\":\"scena_sm\",\"url\":\"https://images.la7play.it/video/0/400/0_1r3bbnld_0_xwtxnoov_2/nuvoloni-sull-economia-e-parlamento-vuoto-puntata-del-13-10/scena-640x360.webp\",\"width\":640,\"height\":360}]},\"cf_thumbnail_cover\":{\"url\":\"https://images.la7play.it/video/0/400/0_1r3bbnld_0_wzzifzek_2/nuvoloni-sull-economia-e-parlamento-vuoto-puntata-del-13-10/cover-600x800.webp\",\"variations\":[{\"style\":\"cover_sm\",\"url\":\"https://images.la7play.it/video/0/400/0_1r3bbnld_0_wzzifzek_2/nuvoloni-sull-economia-e-parlamento-vuoto-puntata-del-13-10/cover-400x533.webp\",\"width\":400,\"height\":533},{\"style\":\"cover_xs\",\"url\":\"https://images.la7play.it/video/0/400/0_1r3bbnld_0_wzzifzek_2/nuvoloni-sull-economia-e-parlamento-vuoto-puntata-del-13-10/cover-200x267.webp\",\"width\":200,\"height\":267}]}}},\"screenWidth\":null,\"isLa7Cinema\":false,\"showPuntataIntera\":true}]\n52:T426,<p>Tra accordi energetici, dichiarazioni contro Volodymyr Zelensky e ipotesi di tregua, la puntata analizza le conseguenze politiche ed economiche delle scelte dell'ex presidente americano. Al centro del dibattito, l'accordo annunciato da Donald Trump con Vladimir Putin sulle forniture energetiche, le critiche rivolte a Volodymyr Zelensky e la proposta di nuove elezioni in Ucraina. Dichiarazioni che alimentano interrogativi sul futuro del conflitto e sugli equilibri internazionali. La puntata approfondisce anche la tregua annunciata sulle infrastrutture energetiche tra Mosca e Kiev, cercando di capire quali effetti concreti possa avere sul terreno e quali ricadute ci saranno per l'economia globale, a partire dal prezzo dell'energia e dei carburanti. Lilli Gruber e i suoi ospiti, Flaminia Camilletti, Lucio Caracciolo, Alessandro De Angelis, discutono delle conseguenze geopolitiche delle ultime iniziative di Trump, del futuro dell'Ucraina e degli effetti che queste decisioni potrebbero avere tanto sugli americani quanto sugli equilibri europei.</p>4a:[\"$\",\"$L3d\",\"395894\",{\"index\":14,\"data\":{\"id\":\"395894\",\"title\":\"Meloni contro l'Europa, Schlein contro chi? - Puntata del 12/10/2026\",\"tags\":null,\"path\":\"/otto-e-mezzo/puntate/puntata-del-12-10-2026-395894\",\"property\":{\"id\":\"549\",\"name\":\"Otto e mezzo\",\"titolo\":\"Otto e mezzo\",\"description\":{\"value\":\"<p>Otto e mezzo</p>\",\"plainValue\":\"Otto e mezzo\"}},\"created\":{\"timestamp\":1791834856,\"time\":\"2026-10-12T19:54:16+00:00\"},\"body\":{\"value\":\"$52\",\"summary\":\"\"},\"smartTvLocandina\":null,\"dataMessaInOnda\":{\"timestamp\":1791830771,\"time\":\"2026-10-12T18:46:11+00:00\"},\"numeroEpisodio\":21,\"numeroStagione\":{\"name\":\"26\"},\"urlVideo\":null,\"uploadVideo\":{\"cf_duration\":\"1926\",\"cf_entry_id\":\"0_2hmcyth4\",\ reenWidth\":null,\"isLa7Cinema\":false,\"showPuntataIntera\":true}]\n4b:[\"$\",\"$L3d\",\"395657\",{\"index\":15,\"data\":{\"id\":\"395657\",\"title\":\"Chi vota per \\\"l'esattore delle tasse?\\\" - Puntata del 9/10/2026\",\"tags\":null,\"path\":\"/otto-e-mezzo/puntate/puntata-del-9-10-2026-395657\",\"property\":{\"id\":\"549\",\"name\":\"Otto e mezzo\",\"titolo\":\"Otto e mezzo\",\"description\":{\"value\":\"<p>Otto e mezzo</p>\",\"plainValue\":\"Otto e mezzo\"}},\"created\":{\"timestamp\":1791575643,\"time\":\"2026-10-09T19:54:03+00:00\"},\"body\":{\"value\":\"<p>A Otto e Mezzo riflettori puntati sul nuovo progetto politico &nbsp;<strong>Pi\u00f9 Uno</strong>, la nuova formazione di centrosinistra che punta a ritagliarsi uno spazio nel panorama politico italiano.&nbsp;</p><p>Al centro del confronto, le prospettive del nuovo soggetto politico e le critiche che arrivano dal centrodestra nei confronti di Ruffini, gi\u00e0 direttore dell'Agenzia delle Entrate. Un dibattito che intreccia temi economici, consenso elettorale e futuro degli equilibri nell'area moderata e progressista. Ospiti di Lilli Gruber: Simona Ruffino, Ernesto Maria Ruffini, Emiliano Fittipaldi</p>\",\"summary\":\"\"},\"smartTvLocandina\":null,\"dataMessaInOnda\":{\"timestamp\":1791571252,\"time\":\"2026-10-09T18:40:52+00:00\"},\"numeroEpisodio\":20,\"numeroStagione\":{\"name\":\"26\"},\"urlVideo\":null,\"uploadVideo\":{\"cf_duration\":\"1898\",\"cf_entry_id\":\"0_humc83w8\",\"cf_thumbnail_url\":\"https://images.la7play.it/video/0/400/0_humc83w8_0_4cnyojrw_12/chi-vota-per-l-esattore-delle-tasse-puntata-del-9-10-2026/scena-854x480.webp\",\"thumbnailDefault\":{\"url\":\"https://images.la7play.it/video/0/400/0_humc83w8_0_4cnyojrw_12/chi-vota-per-l-esattore-delle-tasse-puntata-del-9-10-2026/scena-854x480.webp\",\"variations\":[{\"style\":\"scena_lg\",\"url\":\"https://images.la7play.it/video/0/400/0_humc83w8_0_4cnyojrw_12/chi-vota-per-l-esattore-delle-tasse-puntata-del-9-10-2026/scena-1280x720.webp\",\"width\":1280,\"height\":720},{\"style\":\"scena_sm\",\"url\":\"https://images.la7play.it/video/0/400/0_humc83w8_0_4cnyojrw_12/chi-vota-per-l-esattore-delle-tasse-puntata-del-9-10-2026/scena-640x360.webp\",\"width\":640,\"height\":360}]},\"cf_thumbnail_scena\":{\"url\":\"https://images.la7play.it/video/0/400/0_humc83w8_0_q6o55tjt_2/chi-vota-per-l-esattore-delle-tasse-puntata-del-9-10-2026/scena-854x480.webp\",\"variations\":[{\"style\":\"scena_lg\",\"url\":\"https://images.la7play.it/video/0/400/0_humc83w8_0_q6o55tjt_2/chi-vota-per-l-esattore-delle-tasse-puntata-del-9-10-2026/scena-1280x720.webp\",\"width\":1280,\"height\":720},{\"style\":\"scena_sm\",\"url\":\"https://images.la7play.it/video/0/400/0_humc83w8_0_q6o55tjt_2/chi-vota-per-l-esattore-delle-tasse-puntata-del-9-10-2026/scena-640x360.webp\",\"width\":640,\"height\":360}]},\"cf_thumbnail_cover\":{\"url\":\"https://images.la7play.it/video/0/400/0_humc83w8_0_z7gst8wc_2/chi-vota-per-l-esattore-delle-tasse-puntata-del-9-10-2026/cover-600x800.webp\",\"variations\":[{\"style\":\"cover_sm\",\"url\":\"https://images.la7play.it/video/0/400/0_humc83w8_0_z7gst8wc_2/chi-vota-per-l-esattore-delle-tasse-puntata-del-9-10-2026/cover-400x533.webp\",\"width\":400,\"height\":533},{\"style\":\"cover_xs\",\"url\":\"https://images.la7play.it/video/0/400/0_humc83w8_0_z7gst8wc_2/chi-vota-per-l-esattore-delle-tasse-puntata-del-9-10-2026/cover-200x267.webp\",\"width\":200,\"height\":267}]}}},\"screenWidth\":null,\"isLa7Cinema\":false,\"showPuntataIntera\":true}]\n53:T566,<p>A Otto e Mezzo il confronto si concentra sulla nuova legge elettorale, approvata dopo settimane di scontro politico. Una riforma fortemente voluta da Giorgia Meloni che riapre il dibattito sul rapporto tra governabilit\u00e0, rappresentanza e funzionamento della democrazia parlamentare.&nbsp;</p><p>La puntata parte dalle dichiarazioni di Giovanni Donzelli, che ha rivendicato il principio secondo cui chi ottiene un voto in pi\u00f9 deve poter governare. Un'affermazione che ha immediatamente acceso il confronto tra maggioranza e opposizione e che solleva interrogativi sul reale obiettivo della riforma: garantire maggiore stabilit\u00e0 ai governi oppure rafforzare il potere della coalizione vincente. Al centro della discussione ci sono i meccanismi della nuova legge elettorale, il peso del premio di maggioranza, il ruolo delle liste bloccate e le critiche di chi teme una riduzione della rappresentativit\u00e0 del Parlamento.&nbsp;</p><p>Sullo sfondo resta il tema della governabilit\u00e0 e del delicato equilibrio tra efficacia dell'azione di governo e piena rappresentanza degli elettori. Ospiti della puntata Lilli Gruber approfondisce contenuti, obiettivi e possibili conseguenze della riforma, analizzando uno dei provvedimenti pi\u00f9 divisivi della legislatura e le sue ricadute sul futuro assetto politico italiano con: Luigi Zanda, Italo Bocchino, Massimo Giannini, Carla Bassu</p>4c:[\"$\",\"$L3d\",\"395529\",{\"index\":16,\"data\":{\"id\":\"395529\",\"title\":\"Una nuova legge elettorale per \\\"comandare\\\" - Puntata del 8/10/2026\",\"tags\":null,\"path\":\"/otto-e-mezzo/puntate/puntata-del-8-10-2026-395529\",\"property\":{\"id\":\"549\",\"name\":\"Otto e mezzo\",\"titolo\":\"Otto e mezzo\",\"description\":{\"value\":\"<p>Otto e mezzo</p>\",\"plainValue\":\"Otto e mezzo\"}},\"created\":{\"timestamp\":1791489317,\"time\":\"2026-10-08T19:55:17+00:00\"},\"body\":{\"value\":\"$53\",\"summary\":\"\"},\"smartTvLocandina\":null,\"dataMessaInOnda\":{\"timestamp\":1791484799,\"time\":\"2026-10-08T18:39:59+00:00\"},\"numeroEpisodio\":19,\"numeroStagione\":{\"name\":\"26\"},\"urlVideo\":null,\"uploadVideo\":{\"cf_duration\":\"1940\",\"cf_entry_id\":\"0_8z3n2nut\",\"cf_thumbnail_url\":\"https://images.la7play.it/video/0/400/0_8z3n2nut_0_52txcelq_12/una-nuova-legge-elettorale-per-comandare-puntata-del-8-10-20/scena-854x480.webp\",\"thumbnailDefault\":{\"url\":\"https://images.la7play.it/video/0/400/0_8z3n2nut_0_52txcelq_12/una-nuova-legge-elettorale-per-comandare-puntata-del-8-10-20/scena-854x480.webp\",\"variations\":[{\"style\":\"scena_lg\",\"url\":\"https://images.la7play.it/video/0/400/0_8z3n2nut_0_52txcelq_12/una-nuova-legge-elettorale-per-comandare-puntata-del-8-10-20/scena-1280x720.webp\",\"width\":1280,\"height\":720},{\"style\":\"scena_sm\",\"url\":\"https://images.la7play.it/video/0/400/0_8z3n2nut_0_52txcelq_12/una-nuova-legge-elettorale-per-comandare-puntata-del-8-10-20/scena-640x360.webp\",\"width\":640,\"height\":360}]},\"cf_thumbnail_scena\":{\"url\":\"https://images.la7play.it/video/0/400/0_8z3n2nut_0_bi3kfcip_2/una-nuova-legge-elettorale-per-comandare-puntata-del-8-10-20/scena-854x480.webp\",\"variations\":[{\"style\":\"scena_lg\",\"url\":\"https://images.la7play.it/video/0/400/0_8z3n2nut_0_bi3kfcip_2/una-nuova-legge-elettorale-per-comandare-puntata-del-8-10-20/scena-1280x720.webp\",\"width\":1280,\"height\":720},{\"style\":\"scena_sm\",\"url\":\"https://images.la7play.it/video/0/400/0_8z3n2nut_0_bi3kfcip_2/una-nuova-legge-elettorale-per-comandare-puntata-del-8-10-20/scena-640x360.webp\",\"width\":640,\"height\":360}]},\"cf_thumbnail_cover\":{\"url\":\"https://images.la7play.it/video/0/400/0_8z3n2nut_0_antapp35_2/una-nuova-legge-elettorale-per-comandare-puntata-del-8-10-20/cover-600x800.webp\",\"variations\":[{\"style\":\"cover_sm\",\"url\":\"https://images.la7play.it/video/0/400/0_8z3n2nut_0_antapp35_2/una-nuova-legge-elettorale-per-comandare-puntata-del-8-10-20/cover-400x533.webp\",\"width\":400,\"height\":533},{\"style\":\"cover_xs\",\"url\":\"https://images.la7play.it/video/0/400/0_8z3n2nut_0_antapp35_2/una-nuova-legge-elettorale-per-comandare-puntata-del-8-10-20/cover-200x267.webp\",\"width\":200,\"height\":267}]}}},\"screenWidth\":null,\"isLa7Cinema\":false,\"showPuntataIntera\":true}]\n54:T583,<p>A Otto e Mezzo si riflette sulle conseguenze del 7 ottobre 2023, a tre anni dall'attacco di Hamas che ha provocato la morte di 1.200 israeliani e il rapimento di 251 persone. Una data che ha segnato profondamente Israele e che continua a influenzare la politica, la societ\u00e0 e il dibattito internazionale.&nbsp;</p><p>La puntata parte da una domanda centrale: come \u00e8 cambiato Israele dopo il 7 ottobre? A tre anni da quei fatti, il Paese si confronta ancora con le ferite lasciate dall'attacco, con il tema della sicurezza, con le divisioni interne e con le prospettive politiche in vista delle prossime elezioni. Il confronto si estende anche alla condizione delle comunit\u00e0 ebraiche nel mondo e alla percezione dell'antisemitismo in un contesto internazionale profondamente cambiato dagli eventi degli ultimi anni.&nbsp;</p><p>Un dibattito che intreccia memoria, attualit\u00e0 e futuro del Medio Oriente. Ospiti della puntata Lilli Gruber ne discute con: Yossi Beilin, storico esponente della sinistra israeliana, gi\u00e0 ministro e protagonista degli Accordi di Oslo; Lina Palmerini, giornalista; Aldo Cazzullo, vicedirettore del Corriere della Sera; Gad Lerner, giornalista e scrittore. Attraverso le loro analisi, la puntata approfondisce i cambiamenti vissuti da Israele dopo il 7 ottobre e le ricadute politiche, sociali e culturali di un evento che continua a influenzare gli equilibri internazionali.</p>4d:[\"$\",\"$L3d\",\"395419\",{\"index\":17,\"data\":{\"id\":\"395419\",\"title\":\"Il 7 Ottobre, Netanyahu e la pace impossibile - Puntata del 7/10/2026\",\"tags\":null,\"path\":\"/otto-e-mezzo/puntate/puntata-del-7-10-2026-395419\",\"property\":{\"id\":\"549\",\"name\":\"Otto e mezzo\",\"titolo\":\"Otto e mezzo\",\"description\":{\"value\":\"<p>Otto e mezzo</p>\",\"plainValue\":\"Otto e mezzo\"}},\"created\":{\"timestamp\":1791402804,\"time\":\"2026-10-07T19:53:24+00:00\"},\"body\":{\"value\":\"$54\",\"summary\":\"\"},\"smartTvLocandina\":null,\"dataMessaInOnda\":{\"timestamp\":1791398516,\"time\":\"2026-10-07T18:41:56+00:00\"},\"numeroEpisodio\":18,\"numeroStagione\":{\"name\":\"26\"},\"urlVideo\":null,\"uploadVideo\":{\"cf_duration\":\"2017\",\"cf_entry_id\":\"0_62wog3wg\",\"cf_thumbnail_url\":\"https://images.la7play.it/video/0/399/0_62wog3wg_0_jw3lkp2g_12/il-7-ottobre-netanyahu-e-la-pace-impossibile-puntata-del-7-1/scena-854x480.webp\",\"thumbnailDefault\":{\"url\":\"https://images.la7play.it/video/0/399/0_62wog3wg_0_jw3lkp2g_12/il-7-ottobre-netanyahu-e-la-pace-impossibile-puntata-del-7-1/scena-854x480.webp\",\"variations\":[{\"style\":\"scena_lg\",\"url\":\"https://images.la7play.it/video/0/399/0_62wog3wg_0_jw3lkp2g_12/il-7-ottobre-netanyahu-e-la-pace-impossibile-puntata-del-7-1/scena-1280x720.webp\",\"width\":1280,\"height\":720},{\"style\":\"scena_sm\",\"url\":\"https://images.la7play.it/video/0/399/0_62wog3wg_0_jw3lkp2g_12/il-7-ottobre-netanyahu-e-la-pace-impossibile-puntata-del-7-1/scena-640x360.webp\",\"width\":640,\"height\":360}]},\"cf_thumbnail_scena\":{\"url\":\"https://images.la7play.it/video/0/399/0_62wog3wg_0_zvhchgws_2/il-7-ottobre-netanyahu-e-la-pace-impossibile-puntata-del-7-1/scena-854x480.webp\",\"variations\":[{\"style\":\"scena_lg\",\"url\":\"https://images.la7play.it/video/0/399/0_62wog3wg_0_zvhchgws_2/il-7-ottobre-netanyahu-e-la-pace-impossibile-puntata-del-7-1/scena-1280x720.webp\",\"width\":1280,\"height\":720},{\"style\":\"scena_sm\",\"url\":\"https://images.la7play.it/video/0/399/0_62wog3wg_0_zvhchgws_2/il-7-ottobre-netanyahu-e-la-pace-impossibile-puntata-del-7-1/scena-640x360.webp\",\"width\":640,\"height\":360}]},\"cf_thumbnail_cover\":{\"url\":\"https://images.la7play.it/video/0/399/0_62wog3wg_0_15fpvi99_2/il-7-ottobre-netanyahu-e-la-pace-impossibile-puntata-del-7-1/cover-600x800.webp\",\"variations\":[{\"style\":\"cover_sm\",\"url\":\"https://images.la7play.it/video/0/399/0_62wog3wg_0_15fpvi99_2/il-7-ottobre-netanyahu-e-la-pace-impossibile-puntata-del-7-1/cover-400x533.webp\",\"width\":400,\"height\":533},{\"style\":\"cover_xs\",\"url\":\"https://images.la7play.it/video/0/399/0_62wog3wg_0_15fpvi99_2/il-7-ottobre-netanyahu-e-la-pace-impossibile-puntata-del-7-1/cover-200x267.webp\",\"width\":200,\"height\":267}]}}},\"screenWidth\":null,\"isLa7Cinema\":false,\"showPuntataIntera\":true}]\n55:T535,<p>Al centro del dibattito, il ricorso alla fiducia da parte della maggioranza e le critiche dell'opposizione, che accusano il governo di limitare il confronto parlamentare su una riforma destinata a incidere direttamente sulle regole democratiche del Paese.&nbsp;</p><p>La puntata parte dalle dichiarazioni pronunciate anni fa da Giorgia Meloni contro l'utilizzo del voto di fiducia sulle leggi elettorali e contro le liste bloccate, parole che oggi vengono richiamate dai suoi avversari politici per contestare la riforma sostenuta dall'attuale maggioranza. Il dibattito si concentra su alcuni dei punti pi\u00f9 controversi del provvedimento: il ricorso alla fiducia, il ruolo delle liste bloccate, il rapporto tra elettori ed eletti e la possibilit\u00e0 che la nuova normativa possa essere sottoposta al vaglio della Corte Costituzionale.&nbsp;</p><p>Sullo sfondo resta una domanda politica centrale: \u00e8 legittimo modificare le regole del voto attraverso un percorso parlamentare fortemente condizionato dal voto di fiducia?&nbsp;</p><p>Lilli Gruber approfondisce i contenuti della riforma, le critiche dell'opposizione e le possibili conseguenze sul sistema politico italiano, analizzando una legge destinata a influenzare i prossimi equilibri elettorali. Ospiti della puntata: Franco Bernab\u00e8, Giovanni Di Lorenzo, Marco Travaglio</p>4e:[\"$\",\"$L3d\",\"395284\",{\"index\":18,\"data\":{\"id\":\"395284\",\"title\":\"Meloni, come si cambia per non morire  - Puntata del 6/10/2026\",\"tags\":null,\"path\":\"/otto-e-mezzo/puntate/puntata-del-6-10-2026-395284\",\"property\":{\"id\":\"549\",\"name\":\"Otto e mezzo\",\"titolo\":\"Otto e mezzo\",\"description\":{\"value\":\"<p>Otto e mezzo</p>\",\"plainValue\":\"Otto e mezzo\"}},\"created\":{\"timestamp\":1791316366,\"time\":\"2026-10-06T19:52:46+00:00\"},\"body\":{\"value\":\"$55\",\"summary\":\"\"},\"sm 3.webp\",\"width\":400,\"height\":533},{\"style\":\"cover_xs\",\"url\":\"https://images.la7play.it/video/0/399/0_qxf8b29d_0_wzj190e0_2/meloni-come-si-cambia-per-non-morire-puntata-del-6-10-2026/cover-200x267.webp\",\"width\":200,\"height\":267}]}}},\"screenWidth\":null,\"isLa7Cinema\":false,\"showPuntataIntera\":true}]\n56:T512,<p>A Otto e Mezzo si guarda alla Spagna dopo la decisione del premier Pedro S\u00e1nchez di convocare elezioni anticipate. Una scelta maturata in un contesto segnato dall'emergenza abitativa, dalle difficolt\u00e0 economiche e dalla crescita delle proteste sociali, che stanno ridefinendo gli equilibri politici del Paese.&nbsp;</p><p>L'annuncio del voto anticipato apre una riflessione pi\u00f9 ampia su un fenomeno che interessa non solo la Spagna, ma gran parte dell'Europa: perch\u00e9, di fronte a crisi economiche, aumento del costo della vita e disagio sociale, i partiti di destra e soprattutto quelli della destra radicale sembrano raccogliere sempre pi\u00f9 consenso?&nbsp;</p><p>La puntata analizza il successo delle forze conservatrici e sovraniste, il rapporto tra emergenza abitativa e voto, e le difficolt\u00e0 dei partiti progressisti nel dare risposte convincenti a una parte dell'elettorato che vive una crescente insicurezza economica e sociale.&nbsp;</p><p>Lilli Gruber discute con i suoi ospiti, Lucio Caracciolo, Pino Corrias, Brunella Bolloli e Federico Fubini, delle elezioni anticipate in Spagna, dell'ascesa delle destre in Europa e delle trasformazioni politiche che stanno attraversando il continente, tra crisi economiche, nuove paure sociali e ridefinizione degli equilibri democratici.</p>4f:[\"$\",\"$L3d\",\"395167\",{\"index\":19,\"data\":{\"id\":\"395167\",\"title\":\"L'Europa in piazza e l'ultra - destra che avanza - Puntata del 5/10/2026\",\"tags\":null,\"path\":\"/otto-e-mezzo/puntate/puntata-del-5-10-2026-395167\",\"property\":{\"id\":\"549\",\"name\":\"Otto e mezzo\",\"titolo\":\"Otto e mezzo\",\"description\":{\"value\":\
